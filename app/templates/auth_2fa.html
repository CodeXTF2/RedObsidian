{% extends "base.html" %}
{% from "_macros.html" import flashes %}
{% block title %}Two-factor authentication · RedObsidian{% endblock %}

{% block body %}
<main class="auth-shell">
  <section class="auth-panel">
    <div>
      <h1 class="brand brand-large">RedObsidian</h1>
      <p class="eyebrow">Two-factor authentication</p>
    </div>
    {{ flashes() }}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        <span>Code from your authenticator app</span>
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus placeholder="123456">
      </label>
      <button type="submit">Verify</button>
    </form>
    <p class="auth-switch">Lost your device? Enter one of your recovery codes instead. <a href="{{ url_for('auth.login') }}">Start over</a></p>
  </section>
</main>
{% endblock %}
