{% extends "app_base.html" %}

{% block app_body %}
<main class="graph-layout" data-page="graph">
  <section class="graph-page-panel">
    <div class="graph-toolbar">
      <h1>Graph</h1>
      <div class="graph-toolbar-actions">
        <div class="zoom-group" role="group" aria-label="Zoom">
          <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
        <button id="zoom-fit" type="button" title="Fit all nodes in view">Fit</button>
        <button id="add-node" class="primary-button" type="button">New node</button>
      </div>
    </div>
    <div id="graph-canvas" class="graph-canvas graph-canvas-full">
      <svg id="edge-layer" aria-hidden="true"></svg>
      <svg id="draft-layer" aria-hidden="true"></svg>
      <div id="node-layer"></div>
      <div id="graph-empty" class="graph-empty" hidden>
        <strong>No nodes in the graph yet</strong>
        <span>Double-click the canvas or use <em>New node</em> to add one.</span>
      </div>
      <div class="graph-hint" aria-hidden="true">
        Hover a node and drag a side dot to link &middot; Drag a line's joint to bend it &middot; Right-drag to pan &middot; Scroll to zoom
      </div>
    </div>
  </section>
  <aside id="graph-node-panel" class="graph-node-panel" inert>
    <div class="graph-node-panel-inner document-shell">
    <button id="close-panel" class="panel-close" type="button" title="Close panel">&times;</button>
    <form id="node-editor" class="node-editor">
      <input id="node-title" class="title-input" placeholder="Untitled page" maxlength="120">
      <input id="node-caption" class="caption-input" placeholder="Add a caption" maxlength="280">
      <div id="node-color-picker" class="color-picker">
        <button type="button" class="color-swatch" data-color="" title="Default"></button>
        <button type="button" class="color-swatch color-red" data-color="red" title="Red"></button>
        <button type="button" class="color-swatch color-orange" data-color="orange" title="Orange"></button>
        <button type="button" class="color-swatch color-yellow" data-color="yellow" title="Yellow"></button>
        <button type="button" class="color-swatch color-green" data-color="green" title="Green"></button>
        <button type="button" class="color-swatch color-blue" data-color="blue" title="Blue"></button>
        <button type="button" class="color-swatch color-pink" data-color="pink" title="Pink"></button>
      </div>
      <div class="graph-actions">
        <button id="add-to-graph" class="add-to-graph-btn" type="button" hidden>Add to Graph</button>
      </div>
      <div id="node-files" class="node-files-block"></div>
      <div id="node-notes" class="live-markdown-editor" contenteditable="true" data-placeholder="Write your notes here (Markdown supported)..."></div>
    </form>
    </div>
  </aside>
  <div id="graph-context-menu" class="context-menu" hidden>
    <button type="button" id="menu-new-node">New node here</button>
    <button type="button" id="menu-open-node">Open as page</button>
    <button type="button" id="menu-reset-link">Reset bend</button>
    <button type="button" id="menu-remove-node">Remove from graph</button>
    <button type="button" id="menu-delete-node" class="danger">Delete page</button>
    <button type="button" id="menu-delete-link" class="danger">Delete link</button>
  </div>
</main>
{% endblock %}
