name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: redobsidian
          POSTGRES_USER: redobsidian
          POSTGRES_PASSWORD: redobsidian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redobsidian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations match the models
        run: |
          python - <<'EOF'
          import os, tempfile
          os.environ["REDOBSIDIAN_INSTANCE_PATH"] = tempfile.mkdtemp()
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from app import create_app, db
          app = create_app()
          with app.app_context(), db.engine.connect() as connection:
              diff = compare_metadata(MigrationContext.configure(connection, opts={"compare_type": True}), db.metadata)
          assert not diff, f"Models and migrations differ; add a migration: {diff}"
          EOF
      - name: Test (SQLite)
        if: matrix.database == 'sqlite'
        run: pytest -q
      - name: Test migrations on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql://redobsidian:redobsidian@localhost:5432/redobsidian
        run: |
          python -c "import os, tempfile; os.environ['REDOBSIDIAN_INSTANCE_PATH'] = tempfile.mkdtemp(); from app import create_app; create_app()"
          python -c "import os, tempfile; os.environ['REDOBSIDIAN_INSTANCE_PATH'] = tempfile.mkdtemp(); from app import create_app; create_app()"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t redobsidian:ci .
      - name: Smoke test
        run: |
          docker run -d --name ro -p 5000:5000 -e REDOBSIDIAN_SECRET_KEY=ci-secret redobsidian:ci
          for i in $(seq 1 30); do curl -fs http://localhost:5000/healthz && exit 0; sleep 2; done
          docker logs ro; exit 1
